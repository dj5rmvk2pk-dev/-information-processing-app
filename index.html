f}.qnav .done{background:#111827;color:#fff}

<script>
const QUESTIONS=[{"id":"1-1","subject":"소프트웨어설계","q":"소프트웨어 개발 생명주기에서 요구사항을 분석하고 명세화하는 활동의 주된 목적은?","options":["데이터베이스를 백업","사용자 요구를 명확한 시스템 요구사항으로 정의","서버를 증설","구현 언어를 결정"],"answer":1,"explain":"요구사항 분석·명세화는 이해관계자의 요구를 명확하게 정의하는 단계입니다.","difficulty":"기본"},{"id":"1-2","subject":"소프트웨어설계","q":"폭포수 모형의 특징으로 가장 적절한 것은?","options":["변화에 즉시 대응하는 것을 최우선","코드부터 작성하고 요구사항을 나중에 결정","단계가 순차적으로 진행","각 반복마다 제품을 완성"],"answer":2,"explain":"폭포수는 분석→설계→구현→시험 등의 단계가 비교적 순차적으로 진행됩니다.","difficulty":"기본"},{"id":"1-3","subject":"소프트웨어설계","q":"프로토타이핑 모형의 주된 장점은?","options":["문서 작성을 완전히 제거","시험 단계를 생략","사용자 요구를 초기 모델로 확인","유지보수가 필요 없게 함"],"answer":2,"explain":"프로토타입으로 요구사항을 시각적으로 확인하고 피드백을 받을 수 있습니다.","difficulty":"기본"},{"id":"1-4","subject":"소프트웨어설계","q":"나선형 모형의 핵심 활동으로 가장 관련이 큰 것은?","options":["무조건적인 일괄 배포","파일 압축","하드웨어 제조","위험 분석"],"answer":3,"explain":"나선형 모형은 반복 과정에서 위험을 분석하고 줄이는 활동을 강조합니다.","difficulty":"기본"},{"id":"1-5","subject":"소프트웨어설계","q":"애자일 개발의 핵심 가치에 가장 가까운 것은?","options":["초기 계획을 절대 변경하지 않음","납품 후 피드백 금지","문서만으로 의사소통","변화에 대응하며 고객과 협력"],"answer":3,"explain":"애자일은 변화 대응, 고객 협력, 동작하는 소프트웨어와 반복적 피드백을 중시합니다.","difficulty":"기본"},{"id":"1-6","subject":"소프트웨어설계","q":"UML에서 클래스의 속성과 연산 등을 표현하는 다이어그램은?","options":["시퀀스 다이어그램","활동 다이어그램","배치 다이어그램","클래스 다이어그램"],"answer":3,"explain":"클래스 다이어그램은 클래스, 속성, 연산 및 관계를 구조적으로 표현합니다.","difficulty":"기본"},{"id":"1-7","subject":"소프트웨어설계","q":"UML에서 객체 간 메시지 교환을 시간 순서로 표현하는 것은?","options":["시퀀스 다이어그램","컴포넌트 다이어그램","배치 다이어그램","클래스 다이어그램"],"answer":0,"explain":"시퀀스 다이어그램은 시간 흐름에 따른 객체 간 상호작용을 표현합니다.","difficulty":"기본"},{"id":"1-8","subject":"소프트웨어설계","q":"UML에서 시스템의 기능을 사용자 관점에서 표현하는 것은?","options":["배치 다이어그램","패키지 다이어그램","클래스 다이어그램","유스케이스 다이어그램"],"answer":3,"explain":"유스케이스 다이어그램은 액터와 시스템 기능의 관계를 표현합니다.","difficulty":"기본"},{"id":"1-9","subject":"소프트웨어설계","q":"UML에서 상태가 사건에 따라 어떻게 변화하는지를 나타내는 것은?","options":["클래스 다이어그램","상태 다이어그램","배치 다이어그램","컴포넌트 다이어그램"],"answer":1,"explain":"상태 다이어그램은 객체나 시스템의 상태 변화와 전이를 표현합니다.","difficulty":"기본"},{"id":"1-10","subject":"소프트웨어설계","q":"자료 흐름도(DFD)의 기본 요소가 아닌 것은?","options":["프로세스","자료 저장","상속","자료 흐름"],"answer":2,"explain":"DFD는 프로세스, 자료 흐름, 자료 저장, 외부 개체 등을 사용합니다.","difficulty":"기본"},{"id":"1-11","subject":"소프트웨어설계","q":"자료 흐름도에서 외부 개체의 역할은?","options":["CPU 스케줄링","시스템과 자료를 주고받는 외부 주체","프로그램 컴파일","데이터베이스 정규화"],"answer":1,"explain":"외부 개체는 시스템 경계 밖에서 시스템과 정보를 교환하는 주체입니다.","difficulty":"기본"},{"id":"1-12","subject":"소프트웨어설계","q":"구조적 분석에서 자료 흐름을 중심으로 시스템을 표현하는 대표적 도구는?","options":["PERT","DFD","ERD","Gantt 차트"],"answer":1,"explain":"DFD는 자료의 흐름과 변환을 중심으로 시스템을 분석합니다.","difficulty":"기본"},{"id":"1-13","subject":"소프트웨어설계","q":"객체지향에서 캡슐화의 설명으로 옳은 것은?","options":["상속을 금지","프로그램을 순차 실행","모든 객체를 하나로 합침","데이터와 관련 연산을 하나로 묶고 내부 구현을 숨김"],"answer":3,"explain":"캡슐화는 객체의 상태와 행동을 묶고 외부에 필요한 인터페이스만 제공합니다.","difficulty":"기본"},{"id":"1-14","subject":"소프트웨어설계","q":"객체지향에서 상속의 의미는?","options":["네트워크를 암호화","객체를 데이터베이스에 저장","메서드를 반드시 삭제","기존 클래스의 특성을 새로운 클래스가 물려받음"],"answer":3,"explain":"상속은 상위 클래스의 속성과 연산을 하위 클래스가 재사용·확장하는 개념입니다.","difficulty":"기본"},{"id":"1-15","subject":"소프트웨어설계","q":"다형성의 대표적인 의미는?","options":["클래스를 하나만 사용","데이터를 여러 번 저장","모든 메서드를 정적으로 실행","동일한 인터페이스가 객체에 따라 다른 동작을 수행"],"answer":3,"explain":"다형성은 같은 메시지에 대해 객체별로 적절한 구현이 수행되는 특성입니다.","difficulty":"기본"},{"id":"1-16","subject":"소프트웨어설계","q":"응집도가 높은 모듈의 특징은?","options":["전역 변수를 무제한 공유","외부 모듈에 강하게 의존","서로 무관한 기능을 많이 포함","모듈 내부 요소들이 하나의 기능과 밀접하게 관련"],"answer":3,"explain":"응집도는 모듈 내부 요소의 관련성입니다. 일반적으로 높을수록 좋은 설계입니다.","difficulty":"기본"},{"id":"1-17","subject":"소프트웨어설계","q":"결합도가 낮은 모듈의 특징은?","options":["모든 데이터를 전역으로 공유","하나의 모듈이 모든 기능 담당","모듈 사이 의존성이 적음","서로의 내부 구현을 직접 사용"],"answer":2,"explain":"결합도는 모듈 간 의존 정도이며 낮을수록 변경 영향이 줄어듭니다.","difficulty":"기본"},{"id":"1-18","subject":"소프트웨어설계","q":"Fan-in이 큰 모듈의 의미는?","options":["하위 모듈이 많음","코드 줄 수가 많음","데이터베이스가 큼","해당 모듈을 호출하는 상위 모듈이 많음"],"answer":3,"explain":"Fan-in은 해당 모듈을 사용하는 상위 모듈의 수입니다.","difficulty":"기본"},{"id":"1-19","subject":"소프트웨어설계","q":"Fan-out이 큰 모듈의 의미는?","options":["입출력이 없음","상속 관계가 많음","호출되는 횟수가 적음","해당 모듈이 호출하는 하위 모듈이 많음"],"answer":3,"explain":"Fan-out은 한 모듈이 직접 호출하는 하위 모듈의 수입니다.","difficulty":"기본"},{"id":"1-20","subject":"소프트웨어설계","q":"모듈의 기능을 가능한 한 단일 목적에 가깝게 설계하는 것과 가장 관련 있는 것은?","options":["높은 결합도","낮은 응집도","전역 상태 증가","높은 응집도"],"answer":3,"explain":"단일 목적의 모듈은 응집도가 높아 유지보수가 쉽습니다.","difficulty":"기본"},{"id":"1-21","subject":"소프트웨어설계","q":"사용자 인터페이스 설계에서 일관성의 의미는?","options":["모든 화면을 다르게 구성","오류 메시지를 생략","사용자 입력을 제한 없이 허용","화면과 기능에서 동일한 규칙과 표현을 유지"],"answer":3,"explain":"일관성은 사용자가 학습한 조작 규칙을 다른 화면에서도 동일하게 적용할 수 있게 합니다.","difficulty":"기본"},{"id":"1-22","subject":"소프트웨어설계","q":"UI 설계에서 사용자의 오류를 예방하거나 쉽게 회복하게 하는 원칙은?","options":["불투명성","중복성","무작위성","오류 예방 및 회복성"],"answer":3,"explain":"좋은 UI는 오류를 줄이고 발생한 오류를 이해하고 복구할 수 있도록 합니다.","difficulty":"기본"},{"id":"1-23","subject":"소프트웨어설계","q":"UI에서 사용자가 시스템의 현재 상태를 알 수 있게 하는 것은?","options":["정규화","피드백","상속","캡슐화"],"answer":1,"explain":"피드백은 사용자의 행동 결과나 시스템 상태를 알려주는 역할을 합니다.","difficulty":"기본"},{"id":"1-24","subject":"소프트웨어설계","q":"디자인 패턴 중 객체 생성을 하나의 인터페이스로 추상화하는 계열은?","options":["행위 패턴","구조 패턴","생성 패턴","네트워크 패턴"],"answer":2,"explain":"생성 패턴은 객체 생성과 관련된 설계를 다룹니다.","difficulty":"기본"},{"id":"1-25","subject":"소프트웨어설계","q":"Singleton 패턴의 목적은?","options":["데이터를 정규화","모든 클래스를 상속","특정 클래스의 인스턴스를 하나로 제한","네트워크 패킷을 분할"],"answer":2,"explain":"Singleton은 애플리케이션에서 특정 객체가 하나만 존재하도록 관리합니다.","difficulty":"기본"},{"id":"1-26","subject":"소프트웨어설계","q":"Adapter 패턴의 목적은?","options":["알고리즘을 무작위화","서로 다른 인터페이스를 호환되게 연결","객체 수를 하나로 제한","데이터베이스를 분산"],"answer":1,"explain":"Adapter는 기존 인터페이스를 클라이언트가 기대하는 형태로 변환합니다.","difficulty":"기본"},{"id":"1-27","subject":"소프트웨어설계","q":"Observer 패턴의 핵심 관계는?","options":["한 객체의 상태 변화가 여러 객체에 통지됨","객체 생성자를 숨김","데이터를 압축","모든 객체가 단일 인스턴스"],"answer":0,"explain":"Observer는 주체의 상태 변화가 여러 관찰자에게 전달되는 구조입니다.","difficulty":"기본"},{"id":"1-28","subject":"소프트웨어설계","q":"MVC에서 Controller의 주된 역할은?","options":["데이터만 저장","DB 서버를 운영","화면만 표시","사용자 입력을 처리하고 Model과 View 사이를 조정"],"answer":3,"explain":"Control :"프로그래밍언어활용","difficulty":"보통","q":"DNS의 역할은?","options":["DB를 정규화한다","CPU를 스케줄링한다","파일을 암호화한다","도메인 이름과 IP 주소 등의 정보를 매핑한다"],"answer":3,"explain":"DNS는 사람이 읽기 쉬운 도메인 이름을 IP 주소 등으로 해석합니다."},{"id":"D289","subject":"프로그래밍언어활용","difficulty":"보통","q":"TCP의 특징으로 적절한 것은?","options":["항상 비연결형이다","IP 주소를 생성한다","오류 제어가 없다","연결 지향적이며 신뢰성 있는 전송을 제공한다"],"answer":3,"explain":"TCP는 연결 설정, 순서 제어, 재전송 등을 통해 신뢰성 있는 전송을 제공합니다."},{"id":"D290","subject":"프로그래밍언어활용","difficulty":"보통","q":"IP의 역할에 가장 가까운 것은?","options":["문자열 정렬","패킷의 논리적 주소 지정과 라우팅","메모리 할당","DB 정규화"],"answer":1,"explain":"IP는 논리적 주소를 이용해 패킷을 목적지 방향으로 전달하도록 합니다."},{"id":"D291","subject":"정보시스템구축관리","difficulty":"보통","q":"대칭키 암호 방식의 특징은?","options":["키가 필요 없다","암호화와 복호화에 같은 비밀키를 사용한다","해시값만 사용한다","공개키와 개인키를 항상 함께 사용한다"],"answer":1,"explain":"대칭키는 동일한 비밀키를 공유해야 하므로 키 관리가 중요합니다."},{"id":"D292","subject":"정보시스템구축관리","difficulty":"보통","q":"비대칭키 암호에서 공개키의 특징은?","options":["항상 비밀번호와 같다","절대 공개하면 안 된다","DB의 기본키이다","공개해도 되는 키로 암호화나 서명 검증 등에 사용된다"],"answer":3,"explain":"공개키는 이름 그대로 공개할 수 있으며 개인키와 쌍을 이룹니다."},{"id":"D293","subject":"정보시스템구축관리","difficulty":"보통","q":"해시 함수의 일반적 특징은?","options":["항상 원문 복원이 가능하다","IP를 자동 생성한다","암호화와 복호화에 같은 키를 쓴다","입력값을 고정 길이의 다이제스트로 변환한다"],"answer":3,"explain":"암호학적 해시는 일방향성을 갖도록 설계되며 무결성 검증 등에 사용됩니다."},{"id":"D294","subject":"정보시스템구축관리","difficulty":"보통","q":"다중요소 인증(MFA)의 예는?","options":["아이디만 입력","화면 밝기 조절","비밀번호만 두 번 입력","비밀번호와 일회용 인증코드를 함께 사용하는 것"],"answer":3,"explain":"서로 다른 인증 요소를 결합하면 계정 탈취 위험을 줄일 수 있습니다."},{"id":"D295","subject":"정보시스템구축관리","difficulty":"보통","q":"DDoS 공격의 목적은?","options":["데이터를 정규화한다","대량의 트래픽 등으로 서비스 자원을 소진시켜 가용성을 저해한다","파일을 압축한다","사용자 인터페이스를 개선한다"],"answer":1,"explain":"DDoS는 여러 출발지에서 대량의 요청을 보내 서비스를 이용하기 어렵게 만듭니다."},{"id":"D296","subject":"정보시스템구축관리","difficulty":"보통","q":"제로 트러스트의 핵심 원칙은?","options":["모든 사용자를 관리자 취급한다","인증을 한 번만 한다","명시적으로 검증하고 지속적으로 신뢰를 확인한다","내부 네트워크는 무조건 신뢰한다"],"answer":2,"explain":"제로 트러스트는 네트워크 위치만으로 신뢰하지 않고 지속적인 검증을 강조합니다."},{"id":"D297","subject":"정 function startSet(setNo){S.mode='set';S.setNo=setNo;S.subject=null;S.list=QUESTIONS.filter(x=>x.set===setNo);S.pos=0;S.answers={};S.endAt=Date.now()+EXAM_MIN*60*1000;clearInterval(S.timer);S.timer=setInterval(tick,500);tick();renderQuiz()}
function startMock(){let by={};QUESTIONS.forEach(q=>(by[q.subject]??=[]).push(q));S.list=Object.values(by).flatMap(a=>a.sort(()=>Math.random()-.5).slice(0,20)).sort(()=>Math.random()-.5);S.mode="mock";S.subject=null;S.pos=0;S.answers={};S.endAt=Date.now()+EXAM_MIN*60*1000;clearInterval(S.timer);S.timer=setInterval(tick,500);tick();renderQuiz()}
function tick(){if(S.endAt&&Date.now()>=S.endAt){finish();return}if(S.endAt)document.getElementById("timer").textContent=fmt(Math.max(0,Math.ceil((S.endAt-Date.now())/1000)))}
function renderQuiz(){let q=S.list[S.pos],ans=S.answers[S.pos]!=null,pct=Math.round(S.pos/S.list.length*100);
document.getElementById("root").innerHTML=`<div class="qno">${S.mode==="mock"?"실전 모의고사":S.mode==="set"?`실전 세트 ${S.setNo}`:S.mode==="difficulty"?"난이도별 문제":"과목별 학습"} · ${S.mode==="difficulty"?q.difficulty:(S.subject||q.subject)} · ${S.pos+1}/${S.list.length}</div><div class="bar"><i style="width:${pct}%"></i></div><div class="q">${q.q}</div>
${q.options.map((o,i)=>`<button class="btn option ${ans?(i===q.answer?"correct":S.answers[S.pos]===i?"wrong":""):""}" ${ans?"disabled":""} onclick="choose(${i})">${i+1}. ${o}</button>`).join("")}
${ans?`<div class="explain"><b>${S.answers[S.pos]===q.answer?"정답 🎉":"오답"}</b><br>${q.explain}</div>`:""}
<div class="grid" style="margin-top:12px"><button class="btn secondary" onclick="prev()">이전</button><button class="btn" onclick="next()">${S.pos===S.list.length-1?"제출":"다음"}</button></div>
<div class="qnav">${S.list.map((_,i)=>`<button class="${S.answers[i]!=null?"done":""}" onclick="gotoQ(${i})">${i+1}</button>`).join("")}</div>`}
function choose(i){if(S.answers[S.pos]!=null)return;S.answers[S.pos]=i;let q=S.list[S.pos];if(i!==q.answer&&!S.wrong.includes(q.id)){S.wrong.push(q.id);save()}renderQuiz()}
function next(){if(S.pos<S.list.length-1){S.pos++;renderQuiz()}else finish()}function prev(){if(S.pos>0){S.pos--;renderQuiz()}}function gotoQ(i){S.pos=i;renderQuiz()}
function finish(){clearInterval(S.timer);document.getElementById("timer").textContent="";if(S.list.length!==100){let c=S.list.reduce((n,q,i)=>n+(S.answers[i]===q.answer?1:0),0);showResult(c,S.list.length,null);return}
let subjects=[...new Set(S.list.map(q=>q.subject))].map(sub=>{let a=S.list.map((q,i)=>({q,i})).filter(x=>x.q.subject===sub),c=a.filter(x=>S.answers[x.i]===x.q.answer).length;return{sub,c,n:a.length,score:c/a.length*100}});
let total=subjects.reduce((n,x)=>n+x.c,0),pass=total>=60&&subjects.every(x=>x.score>=40);showResult(total,100,{subjects,pass})}
function showResult(c,n,d){document.getElementById("root").innerHTML=`<div class="score"><div>모의고사 결과</div><strong class="${d?.pass?"pass":"fail"}">${c}/${n}</strong><h2 class="${d?.pass?"pass":"fail"}">${d?.pass?"합격 🎉":"불합격"}</h2><p class="muted">${c}점 · 합격 기준: 평균 60점 이상 + 모든 과목 40점 이상</p></div>
${d?`<div class="card"><h3>과목별 점수</h3>${d.subjects.map(x=>`<div class="subjectRow"><span>${x.sub}</span><b class="${x.score<40?"danger":""}">${x.c}/${x.n} · ${Math.round(x.score)}점</b></div>`).join("")}</div>`:""}<button class="btn" onclick="startMock()">다시 모의고사</button><button class="btn secondary" onclick="home()">홈으로</button>`}
function wrongbook(){clearInterval(S.timer);document.getElementById("timer").textContent="";let arr=S.wrong.map(id=>QUESTIONS.find(q=>q.id===id)).filter(Boolean);
document.getElementById("root").innerHTML=arr.length?`<h2>오답노트</h2>${arr.map((q,i)=>`<div class="card"><span class="tag">${q.subject}</span><div class="q">${i+1}. ${q.q}</div><p><b>정답:</b> ${q.options[q.answer]}</p><div class="explain">${q.explain}</div></div>`).join("")}<button class="btn secondary" onclick="home()">홈으로</button>`:`<div class="card"><h2>오답노트가 비어 있어요 🎉</h2><p class="muted">틀린 문제는 자동으로 저장됩니다.</p><button class="btn" onclick="home()">홈으로</button></div>`}
home();
</script></body></html>
